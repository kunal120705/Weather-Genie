<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Genie</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="heroSection.css">
    <script src="script.js" defer></script>
</head>

<body>

    <div class="mainDiv">
        <aside class="sidebar">
            <div>
                <div class="heroLogo">
                    Weather Genie
                </div>
                <div class="listBar">

                    <ol class="sidebarList">
                        <li><a href="/">Home</a></li>
                        <li><a href="#" class="sidebarSearch">Search</a></li>
                        <li><a href="/">About</a></li>
                        <li><a href="/">Contact</a></li>
                        <li><a href="/">Feedback</a></li>
                    </ol>
                </div>
                <div class="copyright">
                    MADE BY KUNAL
                </div>
            </div>
        </aside>
    </div>
    <div class="herosection">
        <div class="navbar">
            <div class="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </div>
    
            <input type="text" placeholder="Search City" class="searchCity">
            <button class="searchbtn">Search</button>
    
        </div>

        <main class="heroBackground">
            <div class="heroWeather">
                <!-- <img class="heroImg" src="bgimage1.png" alt=""> -->
                <div class="tempsection">
                    <div class="mainTemp">
                        <div class="cityname">
                            Enter City name
                        </div>
                        <div class="country"></div>
                        <div class="datetime"></div>
                        <div class="temp"></div>
                        <div class="feelslike"></div>
                    </div>
                    <div class="time">
                        <div class="hour"></div>
                        <div class="minute"></div>
                        <div class="sec"></div>
                    </div>
                    <div class="otherInfo">
                        <div class="otherWeather">

                            <div class="minTemp">
                                <h1>Other Info</h1>
                            </div>
                            <div class="maxTemp"></div>
                            <div class="humidity"></div>
                            <div class="pressure"></div>
                            <div class="visibilty"></div>
                        </div>
                        <div class="wind">
                            <div class="speed"></div>
                            <div class="cloud"></div>
                            <div class="rain"></div>
                            <div class="snow"></div>
                            <div class="sunrise"></div>
                            <div class="sunset"></div>
                        </div>
                    </div>
                </div>
                <div class="sameDayforecast">
                    <div class="forecard Weather0"></div>
                    <div class="forecard Weather1"></div>
                    <div class="forecard Weather2"></div>
                    <div class="forecard Weather3"></div>
                    <div class="forecard Weather4"></div>
                    <div class="forecard Weather5"></div>

                </div>
            </div>
        </main>
        <div class="perDayForecast">
            <div class="day day0"></div>
            <div class="day day1"></div>
            <div class="day day2"></div>
            <div class="day day3"></div>
            <div class="day day4"></div>
            <div class="day day5"></div>
        </div>
    </div>
    </div>
</body>

</html>
